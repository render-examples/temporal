databases:
- name: temporal-db
  databaseName: temporal
  user: temporal
  plan: basic-256mb
  diskSizeGB: 1
  region: oregon

envVarGroups:
  - name: temporal-shared
    envVars:
    - key: DYNAMIC_CONFIG_FILE_PATH
      value: /etc/temporal/dynamicconfig.yaml
    - key: DB
      value: postgresql

services:
- type: pserv
  name: temporal-frontend
  autoDeployTrigger: "off"
  plan: starter
  region: oregon
  runtime: docker
  dockerfilePath: ./temporal-cluster/server/auto-setup/Dockerfile
  scaling:
    minInstances: 1
    maxInstances: 3
    targetMemoryPercent: 80
    targetCPUPercent: 80
  envVars:
  - fromGroup: temporal-shared
  - key: SERVICES
    value: frontend
  - key: SKIP_POSTGRES_DB_CREATION
    value: "true"
  - key: DBNAME
    fromDatabase:
      name: temporal-db
      property: database
  - key: DB_PORT
    fromDatabase:
      name: temporal-db
      property: port
  - key: POSTGRES_USER
    fromDatabase:
      name: temporal-db
      property: user
  - key: POSTGRES_PWD
    fromDatabase:
      name: temporal-db
      property: password
  - key: POSTGRES_SEEDS
    fromDatabase:
      name: temporal-db
      property: host
- type: pserv
  name: temporal-history
  autoDeployTrigger: "off"
  plan: starter
  region: oregon
  runtime: docker
  dockerfilePath: ./temporal-cluster/server/Dockerfile
  scaling:
    minInstances: 1
    maxInstances: 3
    targetMemoryPercent: 80
    targetCPUPercent: 80
  envVars:
  - fromGroup: temporal-shared
  - key: SERVICES
    value: history
  - key: TEMPORAL_FRONTEND_HOST
    fromService:
      name: temporal-frontend
      type: pserv
      property: host
  - key: DBNAME
    fromDatabase:
      name: temporal-db
      property: database
  - key: POSTGRES_USER
    fromDatabase:
      name: temporal-db
      property: user
  - key: POSTGRES_PWD
    fromDatabase:
      name: temporal-db
      property: password
  - key: POSTGRES_SEEDS
    fromDatabase:
      name: temporal-db
      property: host
- type: pserv
  name: temporal-matching
  autoDeployTrigger: "off"
  plan: starter
  region: oregon
  runtime: docker
  dockerfilePath: ./temporal-cluster/server/Dockerfile
  scaling:
    minInstances: 1
    maxInstances: 3
    targetMemoryPercent: 80
    targetCPUPercent: 80
  envVars:
  - fromGroup: temporal-shared
  - key: SERVICES
    value: matching
  - key: TEMPORAL_FRONTEND_HOST
    fromService:
      name: temporal-frontend
      type: pserv
      property: host
  - key: DBNAME
    fromDatabase:
      name: temporal-db
      property: database
  - key: POSTGRES_USER
    fromDatabase:
      name: temporal-db
      property: user
  - key: POSTGRES_PWD
    fromDatabase:
      name: temporal-db
      property: password
  - key: POSTGRES_SEEDS
    fromDatabase:
      name: temporal-db
      property: host
- type: pserv
  autoDeployTrigger: "off"
  name: temporal-worker
  plan: starter
  region: oregon
  runtime: docker
  dockerfilePath: ./temporal-cluster/server/Dockerfile
  scaling:
    minInstances: 1
    maxInstances: 3
    targetMemoryPercent: 80
    targetCPUPercent: 80
  envVars:
  - fromGroup: temporal-shared
  # The worker service needs to wait for the history service to be up first,
  # otherwise it will fail with "error starting scanner".
  - key: DEPENDS_ON_HISTORY
    fromService:
      name: temporal-history
      type: pserv
      property: host
  - key: SERVICES
    value: worker
  - key: TEMPORAL_FRONTEND_HOST
    fromService:
      name: temporal-frontend
      type: pserv
      property: host
  - key: DBNAME
    fromDatabase:
      name: temporal-db
      property: database
  - key: POSTGRES_USER
    fromDatabase:
      name: temporal-db
      property: user
  - key: POSTGRES_PWD
    fromDatabase:
      name: temporal-db
      property: password
  - key: POSTGRES_SEEDS
    fromDatabase:
      name: temporal-db
      property: host
- type: pserv
  name: temporal-ui
  autoDeployTrigger: "off"
  plan: starter
  region: oregon
  runtime: docker
  dockerfilePath: ./temporal-cluster/web/Dockerfile
  envVars:
  - key: PORT
    value: 8080
  - key: TEMPORAL_UI_PORT
    value: 8080
  - key: TEMPORAL_PERMIT_WRITE_API
    value: "true"
  - key: TEMPORAL_ADDRESS
    value: temporal-frontend:7233
# For secure external access to the Temporal Workflow Service via REST
# See https://github.com/render-examples/temporal-rest-proxy
# - type: web
#   name: rest-to-grpc-proxy
#   repo: https://github.com/render-examples/temporal-rest-proxy
#   autoDeployTrigger: "off"
#   plan: starter
#   region: oregon
#   runtime: go
#   buildCommand: go build rest-proxy/main.go
#   startCommand: ./main
#   envVars:
#   - key: TEMPORAL_CLUSTER_HOST
#     fromService:
#       name: temporal-frontend
#       type: pserv
#       property: host
#   - key: AUTH_TOKEN
#     sync: false
- type: web
  repo: https://github.com/render-examples/sample-temporal-app
  name: app-workflow-trigger
  plan: starter
  region: oregon
  runtime: go
  buildCommand: go build start/main.go
  startCommand: ./main
  autoDeployTrigger: "off"
  envVars:
  - key: TEMPORAL_CLUSTER_HOST
    fromService:
      name: temporal-frontend
      type: pserv
      property: host
- type: worker
  repo: https://github.com/render-examples/sample-temporal-app
  name: app-worker
  plan: starter
  region: oregon
  runtime: go
  buildCommand: go build worker/main.go
  startCommand: ./main
  autoDeployTrigger: "off"
  envVars:
  - key: TEMPORAL_CLUSTER_HOST
    fromService:
      name: temporal-frontend
      type: pserv
      property: host
